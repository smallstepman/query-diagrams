[workspace]
resolver = "2"
members = [
  "crates/dq-core",
  "crates/dq-cli",
  "crates/dq-python",
  "crates/dq-node",
  "crates/dq-wasm",
]
default-members = ["crates/dq-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
mermaid-rs-parser = "0.1.0"
oxirs-rule = "0.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
