[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot-snake-scoreboard"
version = "0.1.0"
description = "Dagster scoreboard rollup for the polyglot snake indexing example"
requires-python = ">=3.10"
dependencies = [
  "dagster>=1.11,<2",
  "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
