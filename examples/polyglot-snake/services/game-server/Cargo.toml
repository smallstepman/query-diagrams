[workspace]

[package]
name = "polyglot-snake-game-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.8"
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net"] }
